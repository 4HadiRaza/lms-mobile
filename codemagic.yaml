workflows:
  ios-workflow:
    name: iOS App Store & TestFlight Release
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Premier Academy
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rajagulfam.premier
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Flutter build ipa and sign
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true