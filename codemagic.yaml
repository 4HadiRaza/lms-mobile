workflows:
  ios-workflow:
    name: iOS App Store & TestFlight Release
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Premier Academy
    environment:
      groups:
        - ios_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "com.rajagulfam.premier" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
      - name: Install certificates into keychain
        script: keychain add-certificates
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Flutter build ipa and sign
        script: |
          flutter build ipa --release \
            --build-name=1.0.1 \
            --build-number=5 \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true